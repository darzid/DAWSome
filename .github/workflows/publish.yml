name: Build and publish merged DAWSome page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        
      - name: Version Increment
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch
  
      - name: Copy js
        run: |
          mkdir -p _site
          mkdir -p _site/js
          mkdir -p _site/js/modules
          mkdir -p _site/js/modules/DAWSome
          mkdir -p _site/js/modules/PresetManager

          cp DAWSome.html _site
          cp js/*.js _site/js
          cp js/modules/DAWSome/DAWSome.js _site/js/modules/DAWSome
          cp js/modules/PresetManager/PresetManager.js _site/js/modules/PresetManager
          cp manifest.json _site
          cp service-worker.js _site
          
      - name: Copy icon
        run: |
          cp favicon.ico _site
          cp manifest.json _site
          cp service-worker.js _site
      

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          tags: "DAWSome:${{ steps.version.outputs.version }}"

      - name: Create tag & GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
