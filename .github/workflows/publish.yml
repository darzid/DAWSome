reads DAWSome.css
injects it as a <style> block before </head> in DAWSome.html
writes the result to a generated file named index.html
publishes that generated file to GitHub Pages
does not commit the merged HTML back into the source repo
Important note:

This is not a git commit to DAWSome.html.
It is a build artifact deployment, which is the cleanest way to do “publish merged output only”.
If you want a version that publishes to a separate branch like gh-pages instead of GitHub Pages, that is also possible, but it is still a branch push, not a commit to DAWSome2. The Pages artifact route is better if you truly want “not committed back to the repo”.

