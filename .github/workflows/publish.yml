{
  "name": "DAWSome",
  "short_name": "DAWSome",
  "start_url": "/DAWSome/",
  "display": "standalone",
  "background_color": "#1c1c1c",
  "theme_color": "#f2b544",
  "icons": [
    {
      "src": "/DAWSome/icon-192.png",
