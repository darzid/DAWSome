However, I tried to also merge my main script (DAWSome.js) into the DAWSome.html file, but that gives an error.
The issue is likely that you're trying to inject the JavaScript into the <head> section like you did with the CSS, but JavaScript in the <head> can cause problems (blocking, timing issues, etc.).

Here are the typical approaches:

Option 1: Inject before </body> (recommended)

JavaScript
const merged = html.replace(/<\/body>/i, `<script>\n${js}\n</script>\n</body>`);
This places the script at the end of the HTML, which is better for performance and avoids blocking page load.

Option 2: Keep the external script reference Leave the <script src="DAWSome.js"></script> tag in the HTML and don't try to inline it.

Option 3: Inject in <head> with defer attribute

JavaScript
const merged = html.replace(/<\/head>/i, `<script defer>\n${js}\n</script>\n</head>`);
Though this is less ideal than injecting at the end.

