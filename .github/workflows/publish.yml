name: Build and publish merged DAWSome page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        
      - name: Merge CSS and script into HTML
        run: |
          mkdir -p _site

          node <<'NODE'
          const fs = require('fs');

          const html = fs.readFileSync('DAWSome.html', 'utf8');
          const css = fs.readFileSync('DAWSome.css', 'utf8');
          const styleBlock = `<style>\n${css}\n</style>\n`;
          
          const mainScript = fs.readFileSync('DAWSome.js', 'utf8');
          const mainScriptBlock = `<script>\n${mainScript}\n</script>\n`;
          
          const dataScript = fs.readFileSync('DAWSome-data.js', 'utf8');
          const dataScriptBlock = `<script>\n${dataScript}\n</script>\n`;
          
          const presetBrowserScript = fs.readFileSync('presetbrowser.js', 'utf8');
          const presetBrowserScriptBlock = `<script>\n${presetBrowserScript}\n</script>\n`;
          
          const mixerScript = fs.readFileSync('mixer.js', 'utf8');
          const mixerScriptBlock = `<script>\n${mixerScript}\n</script>\n`;
          
          if (!/<\/head>/i.test(html)) {
            throw new Error('DAWSome.html does not contain a </head> tag');
          }

          const merged = html.replace(/<\/head>/i, `${styleBlock}</head>`)
            .replace(/<script src="DAWSome-data.js"><\/script>/i, `${dataScriptBlock}`)
            .replace(/<script src="presetbrowser.js"><\/script>/i, `${presetBrowserScriptBlock}`)
            .replace(/<script src="mixer.js"><\/script>/i, `${mixerScriptBlock}`)
            .replace(/<script src="DAWSome.js"><\/script>/i, `${mainScriptBlock}`);
          
          fs.writeFileSync('_site/index.html', merged);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
