Step 3: Create a basic service-worker.js
JavaScript
const CACHE_NAME = 'DAWSome-v1';
const urlsToCache = ['/DAWSome/'];

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => {
      return cache.addAll(urlsToCache);
    })
  );
});

self.addEventListener('fetch', event => {
  event.respondWith(
    caches.match(event.request).then(response => {
      return response || fetch(event.request);
    }).catch(() => {
      return caches.match('/DAWSome/');
    })
  );
});
Step 4: Register the service worker in your HTML/JS
Add this to DAWSome.js or inline in your HTML:

JavaScript
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/DAWSome/service-worker.js');
}
