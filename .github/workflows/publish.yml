I see the issue! On line 47, the workflow is trying to replace <script src="DAWSome.js"></script> with the inline script, but that tag likely doesn't exist in your HTML or the regex isn't matching it correctly.

Looking at your HTML earlier, I saw line 7: <link rel="stylesheet" href="DAWSome.css"> but I didn't see an explicit <script src="DAWSome.js"></script> tag.

Here's the fix — update the workflow to inject the script before </body> instead of trying to replace a specific tag:

YAML
name: Build and publish merged DAWSome page

on:
  push:
    branches: [ "main", "DAWSome2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DAWSome2
        uses: actions/checkout@v4
        with:
          ref: DAWSome2

      - name: Merge CSS and script into HTML
        run: |
          mkdir -p _site

          node <<'NODE'
          const fs = require('fs');

          const html = fs.readFileSync('DAWSome.html', 'utf8');
          const css = fs.readFileSync('DAWSome.css', 'utf8');
          const script = fs.readFileSync('DAWSome.js', 'utf8');
          
          const styleBlock = `<style>\n${css}\n</style>\n`;
          const scriptBlock = `<script>\n${script}\n</script>\n`;

          if (!/<\/head>/i.test(html)) {
            throw new Error('DAWSome.html does not contain a </head> tag');
          }
          
          if (!/<\/body>/i.test(html)) {
            throw new Error('DAWSome.html does not contain a </body> tag');
          }

          // Inject CSS before </head>
          let merged = html.replace(/<\/head>/i, `${styleBlock}</head>`);
          
          // Remove old script link if it exists (optional)
          merged = merged.replace(/<script\s+src=["']DAWSome\.js["']><\/script>\n?/i, '');
          
          // Inject script before </body>
          merged = merged.replace(/<\/body>/i, `${scriptBlock}</body>`);
          
          fs.writeFileSync('_site/index.html', merged);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
