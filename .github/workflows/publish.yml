Why Android says “App cannot be installed”

Because the page is not a valid PWA install target.
It is not enough to be a webpage; the browser wants a manifest, icon, and service worker.
The “install as app” flow is browser- and platform-specific, and it won’t show for bare static HTML without PWA metadata.
