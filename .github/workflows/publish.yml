Add service-worker.js
Create this file at the root of the site:

JavaScript
const CACHE_NAME = 'dawsome-v1';
const ASSETS = [
  './',
  './index.html',
  './manifest.json',
  './DAWSome.css',
  './DAWSome.html'
];

self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
  );
  self.skipWaiting();
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(
        keys
          .filter((key) => key !== CACHE_NAME)
          .map((key) => caches.delete(key))
      )
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch', (event) => {
  if (event.request.method !== 'GET') return;

  event.respondWith(
    caches.match(event.request).then((cached) => {
      if (cached) return cached;

      return fetch(event.request).then((response) => {
        const responseClone = response.clone();
        caches.open(CACHE_NAME).then((cache) => cache.put(event.request, responseClone));
        return response;
      }).catch(() => {
        return caches.match('./index.html');
      });
    })
  );
});
Add the manifest link and service worker registration
In the generated HTML, add this in the <head> section:

HTML
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f2b544">
<meta name="apple-mobile-web-app-capable" content="yes">
And in your JS (or inline script), add this:

JavaScript
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch((err) => console.warn('SW registration failed:', err));
  });
}
