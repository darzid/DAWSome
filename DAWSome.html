      "parameters": {

        "voice1": "devices/MonoSynth"

    "FMSynth": {
      "type": "Instrument",
      "parameters": {

        "portamento": "unitTypes/Time",
        "volume": "unitTypes/Decibels",
        "harmonicity": "unitTypes/NormalRange",
        "modulationIndex": "unitTypes/NormalRange",
        "envelope": "modules/AmplitudeEnvelope",
        "modulation": "modules/OmniOscillator",
        "modulationEnvelope": "modules/ModulationEnvelope",
        "oscillator": "modules/OmniOscillator"
      }
    },

    "MembraneSynth": {
      "type": "Instrument",
      "parameters": {
        "detune": "unitTypes/Cents",
        "portamento": "unitTypes/Time",

        "octaves": "unitTypes/Octaves",
        "envelope": "modules/AmplitudeEnvelope",
        "oscillator": "modules/OmniOscillator"
      }
    },

    "MetalSynth": {
      "type": "Instrument",
      "parameters": {
        "detune": "unitTypes/Cents",
        "portamento": "unitTypes/Time",
        "volume": "unitTypes/Decibels",
        "harmonicity": "unitTypes/NormalRange",
        "modulationIndex": "unitTypes/NormalRange",
        "octaves": "unitTypes/Octaves",

      }

    "MonoSynth": {
      "type": "Instrument",
      "parameters": {

    "PluckSynth": {

    "Synth": {

      "parameters": {

        "envelope": "modules/AmplitudeEnvelope",
        "oscillator": "modules/OmniOscillator"
      }
    },

    "AutoFilter": {
      "type": "Effect",
      "parameters": {
        "type": "enumTypes/OscillatorType",

        "octaves": "unitTypes/NormalRange",

      }
    },

    "AutoPanner": {
      "type": "Effect",
      "parameters": {

    "AutoWah": {
      "type": "Effect",

    },

      "type": "Effect",

      "type": "Effect",
      "parameters": {
        "roomSize": "unitTypes/NormalRange",

    },

    "LFO": {
      "type": "Effect",
      "parameters": {
        "type": "enumTypes/OscillatorType",

        "frequency": "unitTypes/Time",

    "Phaser": {
      "type": "Effect",
      "parameters": {

</script>
<div id="PresetBrowser" class="PresetBrowser">
  <div id="presets-data" style="display: none"></div>
</div>
<div id="app">
  <div class="toolbar">
    <div class="group">
      <button id="playBtn" class="btn" title="Play / Stop (Space)">▶</button>
      <span id="posReadout" class="readout">1.1.1</span>
      <label>BPM <input id="bpmInput" type="number" min="20" max="300" step="1" value="140"></label>
      <button id="loopBtn" class="btn on" title="Loop the arrangement">Loop</button>
      <button id="followBtn" class="btn on" title="Scroll with the playhead">Follow</button>
      <button id="drawClipsBtn" class="btn on" title="Draw clips">Draw</button>
    </div>
    <div class="group">
      <button id="importBtn" class="btn" title="Import a Standard MIDI File (.mid)">Import MIDI</button>
      <input id="midiFile" type="file" accept=".mid,.midi,audio/midi">
      <button id="addTrackBtn" class="btn">+ Track</button>
      <button id="addClipBtn" class="btn" title="New 1-bar clip on the selected track at the playhead">+ Clip</button>
      <button id="dupClipBtn" class="btn" title="Duplicate selected clip (Ctrl+D)">Duplicate</button>
      <button id="delClipBtn" class="btn" title="Delete selected clip">Delete clip</button>
    </div>
    <div class="group">
      <button id="loadBtn" class="btn" title="Load project">Load</button>
      <input id="projectFile" type="file" accept=".json">
      <button id="saveBtn" class="btn" title="Save project">Save</button>
      <span class="readout" style="min-width: 0">Zoom</span>
      <button id="arrZoomOutH" class="btn">H−</button><button id="arrZoomInH" class="btn">H+</button>
      <button id="arrZoomOutV" class="btn">V−</button><button id="arrZoomInV" class="btn">V+</button>
    </div>
  </div>

  <div class="arrangement">
    <div class="corner">Tracks</div>
    <div id="arrRulerWrap"><canvas id="arrRulerCanvas" class="rulerCanvas"></canvas></div>
    <div id="trackHeadersWrap"><div id="trackHeaders"></div></div>
    <div id="arrGridWrap">
      <canvas id="arrGridCanvas" class="gridCanvas"></canvas>
      <div id="arrScroller" class="scroller"><div id="arrSpacer"></div></div>
    </div>
  </div>

  <div class="bottom-panel">
    <div id="hint" class="hint"></div>
    
    <div class="editor">
      <div class="toolbar">
        <div class="group"><span id="clipTitle" class="title">No clip selected</span>
          <label>Len <input id="lenInput" type="number" min="0.25" max="256" step="0.25" value="1"> bars</label>
          <button id="loopClipBtn" class="btn">Loop</button>
          <label>End <input id="endInput" type="number" min="0" max="256" step="1" value="1"></label>
        </div>
        <div class="group">
          <label>Grid
            <select id="gridSelect">
              <optgroup label="Adaptive">
                <option value="widest">Widest</option><option value="wide">Wide</option>
                <option value="medium" selected>Medium</option><option value="narrow">Narrow</option>
                <option value="narrowest">Narrowest</option>
              </optgroup>
              <optgroup label="Fixed">
                <option value="1bar">1 Bar</option><option value="1/2">1/2</option><option value="1/4">1/4</option>
                <option value="1/8">1/8</option><option value="1/16">1/16</option><option value="1/32">1/32</option>
              </optgroup>
              <option value="off">Off</option>
            </select>
          </label>
          <button id="tripletBtn" class="btn">Triplet</button>
          <button id="snapBtn" class="btn on">Snap</button>
          <span id="gridReadout" class="readout">1/16</span>
        </div>
        <div class="group">
          <button id="drawBtn" class="btn on" title="Draw mode (B)">✎ Draw</button>
          <button id="clearBtn" class="btn" title="Delete all notes in this clip">Clear notes</button>
        </div>
        <div class="group">
          <span class="readout" style="min-width: 0">Zoom</span>
          <button id="edZoomOutH" class="btn">H−</button><button id="edZoomInH" class="btn">H+</button>
          <button id="edZoomOutV" class="btn">V−</button><button id="edZoomInV" class="btn">V+</button>
        </div>
      </div>
      <div class="roll">
        <div class="corner"></div>
        <div id="edRulerWrap"><canvas id="edRulerCanvas" class="rulerCanvas"></canvas></div>
        <div id="edKeysWrap"><canvas id="edKeysCanvas"></canvas></div>
        <div id="edGridWrap">
          <canvas id="edGridCanvas" class="gridCanvas"></canvas>
          <div id="edScroller" class="scroller"><div id="edSpacer"></div></div>
        </div>
      </div>
    </div>
    
    <div class="instrument-panel"></div>
    <div class="effects-panel"></div>
    <div class="modulation-panel"></div>
    <div class="mixer faders"></div>

    <div class="tab-strip">
      <button id="clip-editor-tab-button" class="btn on">Clip editor</button>
      <button id="instrument-panel-tab-button" class="btn">Instrument</button>
      <button id="effects-panel-tab-button" class="btn">Effects</button>
      <button id="modulation-panel-tab-button" class="btn">Modulation</button>
      <button id="mixer-tab-button" class="btn">Mixer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="DAWSome.js"></script>
</body>
</html>
